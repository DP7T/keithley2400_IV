name: Build Windows exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "**.png"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyvisa numpy matplotlib
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name KeithleyIV --collect-all pyvisa keithley2400_gui.pyw
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: KeithleyIV-exe
          path: dist/KeithleyIV.exe
      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KeithleyIV.exe

